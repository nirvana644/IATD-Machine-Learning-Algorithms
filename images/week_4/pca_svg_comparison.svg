<svg font-family="-apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif" font-weight="430" data-d-component="svg" fill="currentColor" style="color:rgb(26, 28, 31)" viewBox="0 0 360 390" width="100%" xmlns="http://www.w3.org/2000/svg"><rect x="105" y="10" width="150" height="48" rx="7" fill="#888888" fill-opacity=".09" stroke="#888888" stroke-opacity=".6"/><text x="180" y="30" text-anchor="middle" font-size="12" fill="currentColor">Centred dataset</text><text x="180" y="47" text-anchor="middle" font-size="15" fill="currentColor">Xc</text><path d="M180 58 V73 H90 V102 M180 73 H270 V102" stroke="currentColor" stroke-opacity=".5" fill="none"/><g font-size="12" font-weight="600" text-anchor="middle"><text x="90" y="91" fill="#3984da">Traditional PCA</text><text x="270" y="91" fill="#24996b">PCA using SVD</text></g><rect x="10" y="106" width="160" height="63" rx="7" fill="#3984da" fill-opacity=".09" stroke="#3984da"/><text x="90" y="129" font-size="11.5" fill="currentColor" text-anchor="middle">Calculate covariance</text><text x="90" y="151" font-size="13" fill="#3984da" text-anchor="middle">C = XcᵀXc / (n−1)</text><rect x="10" y="203" width="160" height="62" rx="7" fill="#3984da" fill-opacity=".09" stroke="#3984da"/><text x="90" y="225" font-size="11.5" fill="currentColor" text-anchor="middle">Eigendecomposition</text><text x="90" y="247" font-size="15" fill="#3984da" text-anchor="middle">C = QΛQᵀ</text><rect x="190" y="203" width="160" height="62" rx="7" fill="#24996b" fill-opacity=".09" stroke="#24996b"/><text x="270" y="225" font-size="11.5" fill="currentColor" text-anchor="middle">Direct SVD</text><text x="270" y="247" font-size="15" fill="#24996b" text-anchor="middle">Xc = UΣVᵀ</text><g stroke="currentColor" stroke-opacity=".5" fill="none"><path d="M90 169 V201 m-4 -6 l4 6 4 -6"/><path d="M270 104 V201 m-4 -6 l4 6 4 -6"/><path d="M90 265 V310 H180 V327 M270 265 V310 H180"/></g><rect x="203" y="124" width="134" height="40" rx="5" fill="#24996b" fill-opacity=".06" stroke="#24996b" stroke-dasharray="4 3"/><text x="270" y="140" font-size="11" fill="#24996b" text-anchor="middle">No covariance</text><text x="270" y="154" font-size="11" fill="#24996b" text-anchor="middle">matrix required</text><text x="90" y="286" font-size="13" text-anchor="middle" fill="#3984da">Q, λᵢ</text><text x="270" y="286" font-size="13" text-anchor="middle" fill="#24996b">V, σᵢ²/(n−1)</text><rect x="70" y="329" width="220" height="53" rx="7" fill="#888888" fill-opacity=".09" stroke="#888888" stroke-opacity=".6"/><text x="180" y="349" text-anchor="middle" fill="currentColor" font-size="13" font-weight="600">Same PCA results</text><text x="180" y="367" text-anchor="middle" fill="currentColor" font-size="11.5">Principal directions and variance</text></svg>